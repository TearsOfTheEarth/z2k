name: Build CF Proxy MT7628

on:
  push:
    branches: [ cfproxy ]
    paths:
      - 'mtproxy-client/**'
  workflow_dispatch:

jobs:
  build-cfproxy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mtproxy-client
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: cfproxy
    
    - name: Set up Go 1.25
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
    
    - name: Build for MT7628 (mipsle softfloat)
      env:
        CGO_ENABLED: 0
        GOOS: linux
        GOARCH: mipsle
        GOMIPS: softfloat
      run: |
        go build \
          -ldflags="-s -w -X main.buildVersion=cfproxy-$(date +%Y%m%d)" \
          -trimpath \
          -buildvcs=false \
          -o tg-mtproxy-client-cfproxy-mt7628 \
          .
    
    - name: Check binary
      run: |
        file tg-mtproxy-client-cfproxy-mt7628
        ls -lh tg-mtproxy-client-cfproxy-mt7628
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: tg-mtproxy-client-cfproxy-mt7628
        path: mtproxy-client/tg-mtproxy-client-cfproxy-mt7628
        retention-days: 90
